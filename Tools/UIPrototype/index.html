/* Compact effect summary, with the shared energy budget inside the action bar. */
.panel{width:22%;padding:.85cqw;bottom:5%}

.panel{width:23%;padding:.85cqw}

/* Match the visible hand band: roughly the bottom 19% of the battle viewport. */

.actions{grid-template-columns:.75fr 1.25fr 1fr}

.player{left:2.4%;bottom:1%;width:20%;padding:.75cqw 1cqw .65cqw;background:linear-gradient(135deg,#242726f5,#111919f2 65%);border:1px solid #9f89534d;border-left:3px solid #9f8953;box-shadow:inset 0 0 0 3px #0c111380,0 6px 20px #0007;clip-path:polygon(0 0,94% 0,100% 9%,100% 100%,4% 100%,0 91%)}

.vitals{display:flex;align-items:center;gap:.8cqw}.life{flex:1;min-width:0}.life-label{display:flex;align-items:center;gap:.45cqw;margin-bottom:.45cqw}.life-label svg{width:1cqw;height:1cqw;fill:#ac675b;stroke:#dd8b78;stroke-width:.6}.life-value{font-size:1.4cqw;font-variant-numeric:tabular-nums;color:#f0dfcb;line-height:1}.life-value small{font-size:.8cqw;color:#9e9c8c}

.shield-token{position:relative;flex-shrink:0;width:3cqw;height:3.5cqw;border:0;background:transparent;color:#e4e8de;padding:0;filter:drop-shadow(0 2px 2px #0008)}.shield-token svg{width:100%;height:100%;fill:#343f40;stroke:#a4aaa0;stroke-width:1.7}.shield-token .shield-inner{fill:none;stroke:#798780;stroke-width:.8}.shield-token span{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:.3cqw;font-size:1.1cqw;font-weight:bold;font-variant-numeric:tabular-nums;text-shadow:0 2px #111}
.shield-token:hover{filter:brightness(1.2)}.shield-token:focus-visible,.player-status:focus-visible{outline:1px solid #ddc185;outline-offset:3px}
.player-statuses{display:flex;gap:.55cqw;margin-top:.65cqw;min-height:1.6cqw}.player-status{position:relative;width:1.65cqw;height:1.65cqw;padding:.2cqw;border:1px solid #77958b66;background:#22302c;color:#b0cdbd;border-radius:2px}.player-status.negative{color:#d98c7c;background:#33201e;border-color:#a5655666}.player-status svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.player-status b{position:absolute;right:-.25cqw;bottom:-.2cqw;font-size:.65cqw;line-height:1;background:#141c1c;padding:.1cqw .2cqw;color:#ebe2cf;font-weight:500}.player-status:hover{background:#414a40}

const tip=document.getElementById('tooltip');
function hideTip(){tip.hidden=true}
function showTip(button,item){tip.replaceChildren();const title=document.createElement('strong');title.textContent=item[2];tip.append(title,document.createTextNode(item[3]));tip.hidden=false;const r=button.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,r.right-tip.offsetWidth))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-12)+'px'}
function renderIcons(id,items,status){const root=document.getElementById(id);root.replaceChildren();if(!items.length){return}items.forEach(item=>{const b=document.createElement('button');b.className='token'+(status?' status':'');b.setAttribute('aria-label',item[2]+(item[1]?' '+item[1]:''));b.setAttribute('aria-describedby','tooltip');b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+glyphs[item[0]]+'</svg>'+(item[1]?'<span class="badge">'+item[1]+'</span>':'')+(item[4]?'<span class="scope-mark">'+item[4]+'</span>':'');b.addEventListener('mouseenter',()=>showTip(b,item));b.addEventListener('focus',()=>showTip(b,item));b.addEventListener('mouseleave',hideTip);b.addEventListener('blur',hideTip);root.append(b)})}
function select(key){hideTip();const h=hands[key];document.getElementById('hand-name').innerHTML=h.name+'<em>× '+h.mult+'</em>';document.getElementById('count').textContent='已选 '+h.count+' 张';renderIcons('damage-icons',h.damage,false);renderIcons('status-icons',h.status,true);document.querySelectorAll('[data-hand]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hand===key)))}
document.querySelectorAll('[data-hand]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.hand)));let timer;document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const t=document.querySelector('.toast');t.textContent=b.dataset.action+' · 原型操作，未执行战斗';t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800)}));addEventListener('resize',hideTip);addEventListener('scroll',hideTip,true);document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});const playerTips={shield:['','','护盾 · 12','护盾与生命分开显示。此处数值为布局示意；清除时机由当前规则决定。'],immunity:['','','控制免疫 · 1 层','状态图标示意。当前 XML 中控制免疫持续至下个敌方阶段结束，角标不代表回合数。'],bleed:['','','流血 · 2 层','状态图标与层数的布局示意，未连接当前角色的真实状态。']};document.querySelectorAll('[data-player-tip]').forEach(b=>{const show=()=>showTip(b,playerTips[b.dataset.playerTip]);b.addEventListener('mouseenter',show);b.addEventListener('focus',show);b.addEventListener('mouseleave',hideTip);b.addEventListener('blur',hideTip)});select('house');
</script></body></html>
